version: '3.9'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: composr
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
  api:
    build:
      context: ./apps/api
    working_dir: /app
    command: npm run dev
    environment:
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/composr
      REDIS_URL: redis://redis:6379
      DB_DRIVER: prisma
      QUEUE_DRIVER: bullmq
      SESSION_SECRET: devsecret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: changeme
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
  web:
    build:
      context: ./apps/web
    working_dir: /app
    command: npm run dev
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
volumes:
  db-data:
