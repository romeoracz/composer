name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present
      - name: Smoke backend
        env:
          WEB_ORIGIN: http://localhost:3000
          SESSION_SECRET: testsecret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: changeme
          USER2_EMAIL: user2@example.com
          USER2_PASSWORD: changeme
        run: |
          npm --prefix apps/api ci || true
          node apps/api/node_modules/.bin/ts-node -e "require('./apps/api/src/index')" &
          sleep 2
          # Login and create org
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"email":"admin@example.com","password":"changeme"}' http://localhost:4000/auth/login | jq -e .ok
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          org=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"name":"Org"}' http://localhost:4000/orgs | jq -r .org.id)
          # Stage 2: integrations creds + test
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"clientId":"id","clientSecret":"secret"}' http://localhost:4000/integrations/creds/linkedin | jq -e .ok
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "CSRF-Token: $csrf" -X POST http://localhost:4000/integrations/test/linkedin | jq -e .ok
          # Stage 3: prompt create and activate
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          v=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"content":"MASTER PROMPT","notes":"init"}' http://localhost:4000/prompts | jq -r .version.id)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"id":"'$v'"}' http://localhost:4000/prompts/activate | jq -e .version
          # Stage 4: seed
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          seed=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"title":"Launch post"}' http://localhost:4000/seeds | jq -r .seed.id)
          # Stage 5: drafts generate (linkedin,x)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          d1=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"seedId":"'$seed'","platforms":["linkedin","x"]}' http://localhost:4000/drafts/generate | jq -r .drafts[0].id)
          # Stage 6: preview validate
          curl -s -H "Content-Type: application/json" -d '{"platform":"x","text":"hello"}' http://localhost:4000/preview/validate | jq -e .ok
          # Stage 7: approve with short delay and cancel then re-approve
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          job=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"draftId":"'$d1'","delayMs":500}' http://localhost:4000/approve | jq -r .job.id)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"jobId":"'$job'"}' http://localhost:4000/approve/cancel | jq -e .ok
          # Re-approve and force run-now publish
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          job2=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"draftId":"'$d1'","delayMs":2000}' http://localhost:4000/approve | jq -r .job.id)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"jobId":"'$job2'"}' http://localhost:4000/publish/run-now | jq -e .published
          # Stage 8: history exists
          curl -s http://localhost:4000/history | jq -e '.items | length >= 1'
      - name: Smoke frontend build
        run: |
          npm --prefix apps/web ci || true
          npm --prefix apps/web run build
