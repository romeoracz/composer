name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present
      - name: Smoke backend
        env:
          WEB_ORIGIN: http://localhost:3000
          SESSION_SECRET: testsecret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: changeme
        run: |
          npm --prefix apps/api ci || true
          node apps/api/node_modules/.bin/ts-node -e "require('./apps/api/src/index')" &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/auth/me | grep 401
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"email":"admin@example.com","password":"changeme"}' http://localhost:4000/auth/login | jq -e .ok
          curl -sSf http://localhost:4000/providers | jq -e '.providers | length >= 3'
          # Analytics idempotency and integrity
          ts=$(date +%s%3N)
          payload='{ "postId":"p1","platform":"x","likes":1,"comments":2,"shares":3,"impressions":10,"at":'$ts' }'
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d "$payload" http://localhost:4000/analytics/ingest | jq -e .ok
          curl -s http://localhost:4000/analytics/list?platform=x | jq -e '.metrics | length >= 1'
          # Inbox recommendations threshold
          curl -sSf http://localhost:4000/inbox/recommendations | jq -e '.items | length >= 1'
          # Export CSV/PDF endpoints
          curl -sSf http://localhost:4000/exports/csv | head -n 1 | grep 'postId'
          curl -sSf http://localhost:4000/exports/pdf > /tmp/report.pdf && test -s /tmp/report.pdf
      - name: Smoke frontend build
        run: |
          npm --prefix apps/web ci || true
          npm --prefix apps/web run build
