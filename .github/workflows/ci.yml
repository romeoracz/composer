name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present
      - name: Smoke backend
        env:
          WEB_ORIGIN: http://localhost:3000
          SESSION_SECRET: testsecret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: changeme
          USER2_EMAIL: user2@example.com
          USER2_PASSWORD: changeme
        run: |
          npm --prefix apps/api ci || true
          node apps/api/node_modules/.bin/ts-node -e "require('./apps/api/src/index')" &
          sleep 2
          # Admin login and create org
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"email":"admin@example.com","password":"changeme"}' http://localhost:4000/auth/login | jq -e .ok
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          orgA=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"name":"Org A"}' http://localhost:4000/orgs | jq -r .org.id)
          # Invite user2 as viewer
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"email":"user2@example.com","asRole":"viewer"}' http://localhost:4000/orgs/invite | jq -e .ok
          # Collab: admin suggests and approves
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          sug=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"content":"Test suggestion"}' http://localhost:4000/collab/suggestions | jq -r .suggestion.id)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -X POST http://localhost:4000/collab/suggestions/$sug/approve | jq -e .suggestion
          # Switch to user2 session
          curl -s http://localhost:4000/auth/logout > /dev/null
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"email":"user2@example.com","password":"changeme"}' http://localhost:4000/auth/login | jq -e .ok
          # Select orgA (user2 invited)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"orgId":"'$orgA'"}' http://localhost:4000/orgs/select | jq -e .ok
          # User2 cannot approve (should 403)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -X POST http://localhost:4000/collab/suggestions/$sug/approve)
          test "$code" = "403"
          # User2 can comment
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"text":"LGTM"}' http://localhost:4000/collab/suggestions/$sug/comments | jq -e .comment
          # Scheduling: schedule and detect conflict
          now=$(date +%s)
          t1=$(( ($now + 600) * 1000 ))
          t2=$(( ($now + 840) * 1000 ))
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          sch=$(curl -s -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"platform":"x","postId":"p1","runAt":'$t1'}' http://localhost:4000/schedules | jq -r .scheduled.id)
          csrf=$(curl -s http://localhost:4000/csrf-token | jq -r .csrfToken)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -H "CSRF-Token: $csrf" -d '{"platform":"x","postId":"p2","runAt":'$t2'}' http://localhost:4000/schedules)
          test "$code" = "409"
      - name: Smoke frontend build
        run: |
          npm --prefix apps/web ci || true
          npm --prefix apps/web run build
