name: ZAP Baseline Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Start API
        run: |
          node apps/api/node_modules/.bin/ts-node -e "require('./apps/api/src/index')" &
          sleep 2
      - name: ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:4000/health'
          fail_action: false
